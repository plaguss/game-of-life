[package]
name = "lifeterm"
version = "0.1.0"
edition = "2024"
description = "Conway's Game of Life in the terminal, with themes, patterns, and configurable rules"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/plaguss/game-of-life"
keywords = ["conway", "game-of-life", "terminal", "tui", "simulation"]
categories = ["command-line-utilities", "games", "simulation"]
exclude = ["examples/lifeterm.gif"]

[dependencies]
crossterm = "0.29.0"
rand = "0.10.3"
ratatui = "0.30.2"
strum = "0.28.0"
